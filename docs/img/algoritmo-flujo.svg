<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1192" viewBox="0 0 900 1192" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
<rect width="900" height="1192" fill="#ffffff"/>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<text x="450.0" y="32.0" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">Detector de caídas y golpes - algoritmo en el nodo (firmware v1.18.0-rabanito)</text>
<text x="450.0" y="52.0" font-size="12" fill="#444444" text-anchor="middle" font-weight="normal">Corre dentro de RABANITO 50 veces por segundo; la interfaz solo lee el resultado.</text>
<rect x="160.0" y="72.0" width="400" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="94.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">1. Leer acelerómetro QMA6100P</text>
<text x="360.0" y="112.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">ejes x, y, z (rango ±32 g) cada 20 ms</text>
<path d="M360.0,124.0 L360.0,148.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<rect x="160.0" y="148.0" width="400" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="170.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">2. Corregir calibración por eje</text>
<text x="360.0" y="188.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">a = (crudo - offset) / ganancia</text>
<path d="M360.0,200.0 L360.0,224.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<rect x="160.0" y="224.0" width="400" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="246.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">3. Magnitud  |a| = raíz(x² + y² + z²)</text>
<text x="360.0" y="264.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">(en reposo vale ~1 g: la gravedad)</text>
<path d="M360.0,276.0 L360.0,300.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<rect x="160.0" y="300.0" width="400" height="52" fill="#ffffff" stroke="#0047ff" stroke-width="1.5"/>
<text x="360.0" y="322.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">4. Guardar |a| en el banco circular</text>
<text x="360.0" y="340.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">últimos 5 s = 250 lecturas</text>
<path d="M360.0,352.0 L360.0,376.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<path d="M360,376 L610.0,436.0 L360,496 L110.0,436.0 Z" fill="#f2f2f2" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="423.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">5. ¿Pasó de MOVIMIENTO a REPOSO?</text>
<text x="360.0" y="441.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">(máx - mín) del último segundo</text>
<text x="360.0" y="459.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">&lt;= 0.15 g</text>
<path d="M110.0,436.0 L50.0,436.0 L50.0,97.0 L160.0,97.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<text x="58.0" y="226.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">no:</text>
<text x="58.0" y="242.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">siguiente</text>
<text x="58.0" y="258.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">lectura</text>
<path d="M360.0,496.0 L360.0,526.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<text x="370.0" y="516.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">sí</text>
<rect x="140.0" y="526.0" width="440" height="88" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="548.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">6. Revisar el banco de 5 s</text>
<text x="360.0" y="566.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">reposo = promedio del último segundo</text>
<text x="360.0" y="584.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">pico   = |a| máximo del banco</text>
<text x="360.0" y="602.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">dif    = pico - reposo</text>
<path d="M360.0,614.0 L360.0,638.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<path d="M360,638 L560.0,686.0 L360,734 L160.0,686.0 Z" fill="#f2f2f2" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="682.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">7. ¿dif &gt;= dif. mínima?</text>
<text x="360.0" y="700.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">(ajustable desde la interfaz)</text>
<path d="M560.0,686.0 L750.0,686.0 L750.0,710.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<text x="572.0" y="678.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">no</text>
<rect x="625.0" y="710.0" width="250" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="750.0" y="732.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">Se informa como</text>
<text x="750.0" y="750.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">'último movimiento'</text>
<text x="750.0" y="768.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">(no alerta)</text>
<path d="M360.0,734.0 L360.0,764.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<text x="370.0" y="754.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">sí</text>
<path d="M360,764 L610.0,819.0 L360,874 L110.0,819.0 Z" fill="#f2f2f2" stroke="#000000" stroke-width="1.5"/>
<text x="360.0" y="806.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">8. ¿Hubo caída libre ANTES del pico?</text>
<text x="360.0" y="824.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">&gt;= 3 lecturas seguidas (60 ms)</text>
<text x="360.0" y="842.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">con |a| &lt; 0.35 g</text>
<path d="M110.0,819.0 L110.0,894.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<text x="102.0" y="812.0" font-size="12" fill="#444444" text-anchor="end" font-weight="normal">sí</text>
<path d="M610.0,819.0 L610.0,894.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<text x="618.0" y="812.0" font-size="12" fill="#444444" text-anchor="start" font-weight="normal">no</text>
<rect x="15.0" y="894.0" width="190" height="40" fill="#e00000" stroke="#e00000" stroke-width="1.5"/>
<text x="110.0" y="916.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">CAÍDA</text>
<rect x="515.0" y="894.0" width="190" height="40" fill="#e00000" stroke="#e00000" stroke-width="1.5"/>
<text x="610.0" y="916.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">GOLPE</text>
<path d="M110.0,934.0 L110.0,1002.0 L140.0,1002.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<path d="M610.0,934.0 L610.0,1002.0 L580.0,1002.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<rect x="140.0" y="968.0" width="440" height="70" fill="#ffe5e5" stroke="#e00000" stroke-width="1.5"/>
<text x="360.0" y="990.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">9. Alarma ENGANCHADA en el nodo</text>
<text x="360.0" y="1008.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">tipo, pico, reposo, dif, hora, cuenta</text>
<text x="360.0" y="1026.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">se vacía el banco (no contar dos veces)</text>
<path d="M360.0,1038.0 L360.0,1062.0" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#f)"/>
<rect x="100.0" y="1062.0" width="520" height="70" fill="#ffffff" stroke="#0047ff" stroke-width="1.5"/>
<text x="360.0" y="1084.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">10. La interfaz lee el nodo cada 1 s (USB o Bluetooth)</text>
<text x="360.0" y="1102.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">foco rojo + sonido + evento guardado + ruta en el mapa</text>
<text x="360.0" y="1120.0" font-size="13" fill="#000000" text-anchor="middle" font-weight="normal">hasta que se presiona 'Borrar alarma'</text>
<text x="450.0" y="1172.0" font-size="11" fill="#444444" text-anchor="middle" font-weight="normal">Parámetros: 50 Hz | banco 5 s | reposo &lt;= 0.15 g en 1 s | caída libre &lt; 0.35 g por 60 ms | dif. mínima ajustable</text>
</svg>